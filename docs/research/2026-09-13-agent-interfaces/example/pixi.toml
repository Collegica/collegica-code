[workspace]
name = "onedoor-example"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = ">=3.11,<3.14"
pytest = ">=8"
fastapi = ">=0.115"
uvicorn = ">=0.30"
httpx = ">=0.27"
mcp = ">=2,<3"

[pypi-dependencies]
ag-ui-protocol = ">=0.1.22"
onedoor = { path = ".", editable = true }

[tasks]
test = { cmd = "pytest -q", description = "Run every adapter against the scripted agent" }
cli  = { cmd = "onedoor", description = "The CLI door" }
rest = { cmd = "uvicorn onedoor.doors.rest:app --port 8771", description = "The REST door on :8771" }
agui = { cmd = "uvicorn onedoor.doors.agui:app --port 8772", description = "The AG-UI door on :8772" }
mcp  = { cmd = "python -m onedoor.doors.mcp_server", description = "The MCP door, over stdio" }
