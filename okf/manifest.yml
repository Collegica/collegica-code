# OKF sidecar manifest — the metadata that cannot be generated.
#
# Source files (website/, docs/, video/) stay exactly as they are. Everything
# OKF needs that Quarto frontmatter does not carry — type, sources with ids,
# who verified what and when, when a fact goes stale — is authored here and
# merged in by scripts/okf.py. `at: git:<path-or-ref>` resolves to a commit
# date so timestamps are never typed by hand.
#
# Actors follow OKF §7: human:<id> for people, <producer>/<version> for agents.
# Most of this bundle was drafted by an agent and reviewed by a person; OKF
# makes that distinction first-class, so it is recorded honestly here.

okf_version: "0.2"

bundle:
  title: Collegica
  site: https://www.collegica.org
  description: >-
    Collegica, projected for agents. The human site is written in Quarto at
    collegica.org; this bundle carries the same knowledge as plain markdown with
    OKF provenance, trust and lifecycle frontmatter, regenerated from the
    source tree on every build. This is a proof of concept covering the Finance
    subject; other subjects follow the same projection.

defaults:
  generated_by: claude/opus-5
  # An explicit instant, deliberately. Deriving this from the manifest's own
  # commit would move under every squash merge and make the committed bundle
  # drift from a fresh projection. Bump it when the manifest changes materially.
  generated_at: "2026-09-13T00:00:00Z"

