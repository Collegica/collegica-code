  # ---- The computation and its data ---------------------------------------
  - id: finance/computations/mortgage
    source: website/static/js/fixed-or-variable/mortgage.js
    build: reference
    type: Attested Computation
    title: "Fixed versus variable, replayed against the real rate path"
    description: >-
      Replays a Canadian mortgage from a signing month against the Bank of
      Canada's actual overnight path, for a fixed contract and for a variable
      one with adjustable or fixed payments, and returns interest charged,
      payments and balance. The single implementation behind the article's
      tables, its chart and its calculator.
    resource: /references/computations/mortgage.js
    tags: [finance, mortgage, simulation]
    status: stable
    runtime: node
    computation: /references/computations/mortgage.js
    parameters:
      - { name: start,      type: string,  required: true,  description: "Signing month, YYYY-MM; must be a month rates.json has an offer for" }
      - { name: term,       type: integer, required: true,  description: "3 or 5" }
      - { name: principal,  type: number,  required: false, description: "Defaults to 500000" }
      - { name: amortYears, type: integer, required: false, description: "Defaults to 25" }
    executor:
      resource: /references/executors/run-compare.md
      receipt: [computation_sha256, rates_sha256, parameters, result]
    attester:
      resource: /references/attesters/mortgage-attester.mjs
    generated: { by: claude/opus-5, at: "git:b71cd72" }   # PR #27 merge, which shipped the simulator
    verified:
      - { by: human:behzad, at: "git:b71cd72" }
    stale_after: "2026-10-28T13:45:00Z"
    sources:
      - { id: rates-data, resource: /references/data/rates.md, title: The rate inputs it reads }
    body: |
      # Computation

      The computation is the `compare()` export of
      [`mortgage.js`](/references/computations/mortgage.js). It reads
      [`rates.json`](/references/data/rates.json) — the overnight-rate path,
      the prime spread, and the best rates on offer at each pinned signing
      month — and replays one contract of each kind month by month.

      Canadian convention throughout: rates are annual, compounded
      semi-annually. Each month is charged the rate in force on its first day.
      Fixed-payment variables let unpaid interest capitalise past the trigger
      rate; real lenders often intervene, so that branch is a ceiling on the
      damage, not the typical outcome. The full list of assumptions and what
      they cost is in [the article](/finance/fixed-or-variable.md#how-to-read-the-simulations-below).

      ## Running it

      Follow [the executor](/references/executors/run-compare.md). It prints a
      receipt carrying the SHA-256 of the computation and of the data it ran
      against, the bound parameters, and the result.

      ## Checking a run

      Pass that receipt to [the attester](/references/attesters/mortgage-attester.mjs).
      It re-hashes the bundled computation and data, re-runs the computation
      with the receipt's own parameters, and reports a verdict. A rewritten
      computation, a swapped data file, or a result that does not match the
      re-run all fail.

      ## Consumers

      * [The article](/finance/fixed-or-variable.md) — every table is generated by this computation, never retyped.
      * The in-page calculator on the human site — same module, loaded in the browser.
      * [The video](/finance/fixed-or-variable-video.md) — every on-screen figure.

