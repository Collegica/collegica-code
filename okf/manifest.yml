directories:
  finance:
    title: Finance
    description: >-
      Mortgages, penalties, and the fine print — starting with the question of
      fixed versus variable, answered by replaying real contracts against the
      rate path that actually happened.
  finance/research:
    title: Research
    description: >-
      The notes behind the Finance articles. Each opens with an "Access and
      confidence" section separating what was read in full from what is
      snippet-only or unverified — read that before trusting a figure.
  finance/computations:
    title: Computations
    description: The sanctioned arithmetic behind the Finance articles, as attested computations.
  finance/newsletter:
    title: Newsletter
    description: Related pieces from the Mechatronics3D newsletter, the site's human-authored companion.
  references:
    title: References
    description: Data files, computation code, and the executor and attester for running and checking them.
  references/data:
    title: Data
  references/computations:
    title: Computation code
  references/executors:
    title: Executors
  references/attesters:
    title: Attesters
  references/skills:
    title: Skills
    description: Skills that teach an agent to consume this bundle — fetch one into your agent's skills directory and restart.
  references/skills/collegica:
    title: collegica
    description: The public skill for Claude Code — every path a fetch from collegica.org, with the download-and-run recipe for both attested computations.
  python:
    title: Python
    description: >-
      Handing Python work to someone else: recreating an environment, building
      something installable, and making an analysis a stranger can run. Two
      articles from September 2026, two from January 2023, and a runnable
      example carried as an attested computation.
  python/research:
    title: Research
    description: >-
      The notes behind the Python articles. Each opens with an "Access and
      confidence" section separating what was read in full from what is
      snippet-only or unverified — and lists what could not be verified at all.
  python/computations:
    title: Computations
    description: The reproducible-research example, as an attested computation with a Python runtime.
  software:
    title: Software development
    description: >-
      Structure, dependencies, packaging, and keeping a codebase tractable
      — and, from September 2026, the setup that lets several AI agents
      work one repository. The Python track is its own section.
  software/research:
    title: Research
    description: The notes behind the Software articles; each opens with what was read and what was not.
  software/research/three-agents:
    title: Three agents
    description: >-
      The notes behind One Repository, Three Agents: the four tools checked
      at the source, and the three CLIs asked the same question here.
  robotics:
    title: Robotics
    description: >-
      The founding subject: robotics learned in simulation. From September
      2026, two articles: a map of NVIDIA's stack — open physics engines at
      the bottom, a proprietary simulator on top, open-weight models beside
      it — and a reading of vision-language-action models, the one shape
      they share and which ones are actually open; each with the part that
      could be checked from a machine with no GPU.
  robotics/research:
    title: Research
    description: The notes behind the Robotics articles; each opens with what was read and what was not.
  robotics/research/nvidia-robotics:
    title: NVIDIA's stack
    description: >-
      The notes behind Train the Robot Before You Build It: the stack checked
      at GitHub and PyPI with the vendor's own pages out of reach, and Warp
      and Newton run and timed on a CPU-only box.
  robotics/research/vla-models:
    title: Vision-language-action models
    description: >-
      The notes behind Words In, Joints Out: eleven models checked at their
      repositories and on PyPI, the papers and vendors' pages out of reach,
      and LeRobot installed here so each model's shape could be read from
      its configuration.
  ai:
    title: AI
    description: >-
      Agents, protocols, and models as tools rather than magic. From September
      2026: an agent packaged behind four doors — CLI, REST, MCP, AG-UI — a
      guide to running an agent entirely on your own machine, the local
      voice agents you can talk to, and the compressed vector index a private
      RAG stack would use — each with the research that checked its claims
      against the source.
  ai/research:
    title: Research
    description: >-
      The notes behind the AI articles. Each opens with an "Access and
      confidence" section separating what was read in full from what was not
      obtained — and names the claims left unverified.
  ai/research/local-agent:
    title: Local agent
    description: >-
      The notes behind the local-agent guide: the components, the three ways
      of serving a model, and the measured run on a 24 GB Mac.
  ai/research/turbovec:
    title: turbovec
    description: >-
      The notes behind Sixteen Times Smaller: the repository, API and
      changelog read at the source, the RaBitQ authors' reproduction, and
      turbovec run against FAISS on two real embedding sets on four CPU
      cores.
  ai/research/voice-agents:
    title: Local voice agents
    description: >-
      The notes behind A Voice in the Room: thirty repositories and two dozen
      PyPI records checked at the source, and the household cascade — Kokoro,
      Silero, three sherpa-onnx recognisers, openWakeWord — timed on four CPU
      cores.
  ai/research/edge-agent:
    title: Edge agent
    description: >-
      The notes behind the pocket-agent guide: LiteRT-LM and its APIs with
      Google's phone numbers, the AI Edge Gallery and FunctionGemma, and the
      runs on a 24 GB Mac — CLI, tools, server, Hermes through the server.
  ai/research/video-from-html:
    title: Videos from HTML
    description: >-
      The notes behind the guide to the site's own videos: the two tools
      checked at the source, and the pipeline re-run and timed.
  aging-well:
    title: Aging well
    description: >-
      Three kinds of capital — mind, muscle and money — and a plan for each,
      with AI as a tool rather than an oracle. Three articles, their videos,
      and the research behind the job-search one.
  aging-well/research:
    title: Research
    description: >-
      The four research streams behind Finding Your Next Job, with AI, plus the
      report that synthesises them. Each note opens with an "Access and
      confidence" section; read it before trusting a figure.
  apps:
    title: Apps
    description: >-
      Small, local-first tools that ship as pages on the site: two built (the
      OWL Planner, in its own repository, and OWL Sessions, in this one) and
      three specced but not built, each because an article commits to it.

concepts:

  # ---- The article ---------------------------------------------------------
  - id: finance/fixed-or-variable
    source: website/finance/fixed-or-variable/index.md
    type: Article
    resource: https://www.collegica.org/finance/fixed-or-variable/
    tags: [finance, mortgage, canada, interest-rates, fixed-vs-variable]
    status: stable
    # The "So what about today?" section carries a dated rate snapshot; the
    # next Bank of Canada announcement is the moment it stops being current.
    stale_after: "2026-10-28T13:45:00Z"
    generated: { by: claude/opus-5, at: "git:d56b8aa" }   # PR #34 merge: the TL;DR, the last content change
    verified:
      # Two independent human checks (OKF §5.2 allows a list): the line-by-line
      # review with five substantive corrections applied in PR #27, and the
      # review of the final TL;DR ordering before PR #34 went live.
      - { by: human:behzad, at: "git:b71cd72" }
      - { by: human:behzad, at: "git:d56b8aa" }
    html_blocks:
      - >-
        **Video:** a 100-second summary of this article —
        [fixed-or-variable.mp4](https://www.collegica.org/static/video/finance/fixed-or-variable.mp4),
        described in [the video concept](/finance/fixed-or-variable-video.md).
      - >-
        **Interactive calculator** — browser-only on the human site. The same
        arithmetic is available to agents as
        [an attested computation](/finance/computations/mortgage.md): supply a
        signing month and a term and run it, rather than reading the numbers
        off this page.
    includes:
      - >-
        *Figure: the Bank of Canada prime rate 2021–2026 against the fixed and
        variable rates on offer in September 2021 and September 2023. Generated
        from [the rates dataset](/references/data/rates.md) by
        [the mortgage computation](/finance/computations/mortgage.md).*
    sources:
      # In-bundle lineage: the notes this article was written from.
      - { id: research-report,   resource: /finance/research/fixed-or-variable.md,  title: Research report and plan }
      - { id: historical-rates,  resource: /finance/research/historical-rates.md,   title: Historical rate data }
