  - id: python/computations/bocrates
    source: docs/research/2026-09-12-python-reproducibility/example/src/bocrates/summary.py
    build: reference
    type: Attested Computation
    title: "bocrates — annual averages of the Bank of Canada overnight rate"
    description: >-
      The eleven-file worked example from the reproducible-research article:
      pure functions, five tests, one script that regenerates every output, and
      a locked environment. Carried here as a runnable tree with a Python
      executor and attester.
    resource: /references/computations/bocrates/src/bocrates/summary.py
    tags: [python, reproducibility, simulation, example]
    status: stable
    runtime: python
    computation: /references/computations/bocrates/src/bocrates/summary.py
    parameters: []
    executor:
      resource: /references/executors/run-bocrates.md
      receipt: [computation_sha256, data_sha256, parameters, result]
    attester:
      resource: /references/attesters/bocrates-attester.py
    generated: { by: claude/opus-5, at: "git:bf24d7c" }
    # Machine-confirmed: the project's own five-test suite ran green and the
    # output regenerated byte-identically before the article was written. A
    # process actor, not a human one — which is exactly the middle trust tier.
    verified: { by: process:pytest, at: "git:bf24d7c" }
    sources:
      - { id: data, resource: /references/data/overnight.md, title: The data it reads }
      - { id: article, resource: /python/reproducible-research.md, title: The article it illustrates }
    body: |
      # Computation

      The computation is `annual_average()` in
      [`summary.py`](/references/computations/bocrates/src/bocrates/summary.py):
      the mean overnight rate per calendar year, from dated observations. It is
      a pure function — everything arrives as an argument, everything leaves as
      a return value — which is what makes it testable, and the reason the
      analysis script that reads the file and writes the output is a separate
      file.

      It declares **no parameters**. The data is fixed and committed, so the
      result is a function of that data alone; there is nothing for an agent to
      supply and nothing for it to edit.

      ## Running it

      Follow [the executor](/references/executors/run-bocrates.md). Standard
      library only, Python 3.11+. It prints a receipt carrying the SHA-256 of
      the computation and of the data, and the result.

      ## Checking a run

      Pass the receipt to [the attester](/references/attesters/bocrates-attester.py).
      It re-hashes the bundled code and data, re-runs the computation, and
      reports a verdict.

      ## The rest of the tree

      The whole example project is under `references/computations/bocrates/`:
      `data/`, `src/`, `tests/`, `analysis/`, `pyproject.toml`, `pixi.toml`,
      `pixi.lock` and `CITATION.cff`. Its own `pixi run all` runs the tests and
      regenerates `outputs/`. The example's README is not carried, because a
      markdown file without frontmatter would break bundle conformance; this
      concept is its description.

