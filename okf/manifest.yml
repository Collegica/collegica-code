      # Known artifacts

      Two signing months carry a first-of-month artifact: the 2022-06 and
      2024-06 captures postdate a prime change within their month, so the first
      month's variable rate runs 50 and 25 basis points high respectively. Every
      later month of those terms is unaffected. Recorded rather than silently
      corrected, because correcting it re-bases every published table.

